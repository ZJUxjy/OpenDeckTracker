name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache verified card data
        id: hsdata-cache
        uses: actions/cache@v4
        with:
          path: data/cards/generated
          key: hsdata-${{ hashFiles('data/cards/source.json', 'scripts/lib/*.ts', 'scripts/sync-card-data.ts') }}

      - name: Generate pinned card data
        if: steps.hsdata-cache.outputs.cache-hit != 'true'
        run: pnpm cards:sync

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @hdt/desktop build
